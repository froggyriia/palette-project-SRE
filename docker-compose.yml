services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: palette_user
      POSTGRES_PASSWORD: palette_pass
      POSTGRES_DB: palette_db
    ports:
      - "5433:5432"
    volumes:
      - palette_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palette_user -d palette_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://palette_user:palette_pass@db:5432/palette_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Where the *browser* should reach the backend — not the internal
      # Docker network address, since fetch() runs client-side. For local
      # docker-compose that's still localhost:8000 (published above); for
      # a real deploy this becomes the backend's public URL.
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  palette_db_data:
