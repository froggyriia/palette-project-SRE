server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path that isn't a real static file falls back to
    # index.html so client-side routing (and plain page refreshes on a
    # deep link) works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime-generated config (see docker-entrypoint.sh) must never be
    # cached, or a redeploy with a new backend URL wouldn't take effect
    # for clients holding a cached copy.
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
