# Synthetic prober: runs the "generate palette" scenario against the backend
# Service every 10 s and exposes prober_* metrics for VictoriaMetrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
spec:
  replicas: 1
  selector:
    matchLabels: {app: prober}
  template:
    metadata:
      labels: {app: prober}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: prober
          image: palette-prober:1.0
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 9100
          env:
            - name: TARGET_URL
              value: "http://backend:8000"
            - name: PROBE_INTERVAL
              value: "10"
            - name: PROBE_TIMEOUT
              value: "3"
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
