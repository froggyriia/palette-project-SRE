apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
      annotations:
        # Service discovery for VictoriaMetrics (job kubernetes-pods).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: palette-backend:1.0
          imagePullPolicy: Never   # image is loaded into minikube locally
          ports:
            - name: http
              containerPort: 8000
            # /metrics on a separate port; not exposed by the Service.
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef: {name: palette-config}
            - secretRef: {name: palette-secret}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: backend}
  ports:
    - port: 8000
      targetPort: 8000
