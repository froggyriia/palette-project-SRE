apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
      annotations:
        # Service discovery for VictoriaMetrics (job kubernetes-pods).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: palette-backend:1.1
          imagePullPolicy: Never   # image is loaded into minikube locally
          ports:
            - name: http
              containerPort: 8000
            # /metrics on a separate port; not exposed by the Service.
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef: {name: palette-config}
            - secretRef: {name: palette-secret}
          env:
            # Release version: GET /version, X-App-Version header, logs, palette_build_info.
            - name: APP_VERSION
              value: "1.1"
            # Fault injection for SLO demos (app/faults.py); 0 = off.
            # Change with: kubectl set env deployment/backend FAULT_DELAY_MS=400
            - name: FAULT_ERROR_RATE
              value: "0"
            - name: FAULT_DELAY_MS
              value: "0"
          # Readiness checks the database (where all state lives): a pod
          # without a database connection gets no traffic.
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness checks only the process, so a database outage does not
          # make Kubernetes restart the backend pods.
          livenessProbe:
            httpGet: {path: /live, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: backend}
  ports:
    - port: 8000
      targetPort: 8000
