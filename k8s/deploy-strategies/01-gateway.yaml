# Gateway API on top of Envoy Gateway (installed by setup.sh).
#
# GatewayClass `eg` is served by the Envoy Gateway controller. Gateway `eg`
# makes the controller start an Envoy proxy (data plane) in the namespace
# envoy-gateway-system; traffic.sh reaches it with kubectl port-forward,
# because a LoadBalancer Service has no external IP on minikube.
#
# EnvoyProxy lowers the resource requests of the Envoy proxy pod (by default
# 100m CPU / 512Mi) so that it fits into minikube next to the application
# and the monitoring stack.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: small-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: small-proxy
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: deploy-demo
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # By default only HTTPRoutes from the same namespace may attach.
