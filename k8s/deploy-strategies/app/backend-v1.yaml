# Backend v1.0.0 — the current release (green in Blue/Green, stable in Canary).
# Same image as the other version; only APP_VERSION and the `version` label differ.
# Used by Blue/Green, Canary, A/B and Shadow: the HTTPRoute chooses the Service.
apiVersion: v1
kind: Service
metadata:
  name: backend-v1
  namespace: deploy-demo
spec:
  selector:
    app: palette-backend
    version: v1.0.0
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v1
  namespace: deploy-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: palette-backend
      version: v1.0.0
  template:
    metadata:
      labels:
        app: palette-backend
        version: v1.0.0
      annotations:
        # Scraped by VictoriaMetrics (job kubernetes-pods); the pod labels
        # app/version become labels of every metric.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: palette-backend:1.1
          imagePullPolicy: Never   # built locally and loaded with `minikube image load`
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef: {name: palette-config}
            - secretRef: {name: palette-secret}
          env:
            # The only difference between releases: returned by GET /version,
            # in the X-App-Version header, in logs and in palette_build_info.
            - name: APP_VERSION
              value: v1.0.0
          # Readiness: the pod gets traffic only when the database is reachable.
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness: the process answers HTTP (does not depend on the database).
          livenessProbe:
            httpGet: {path: /live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          # Graceful shutdown: keep serving for 5 s after the pod is marked
          # Terminating, while Envoy removes it from the endpoints. Without
          # this a request can reach a pod that is already shutting down (503).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
