# A/B: the audience is chosen by a header, not by chance.
# Requests with `x-user-group: beta` go to v2.0.0, all others to v1.0.0.
# Rules are matched from the most specific one, so the header rule wins.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-user-group
              value: beta
      backendRefs:
        - name: backend-v2
          port: 80
    - backendRefs:
        - name: backend-v1
          port: 80
