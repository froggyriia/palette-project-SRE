# CANARY: 50% of the requests go to v2.0.0, 50% stay on v1.0.0.
# Ramp: 90/10 -> 50/50 -> 0/100. To roll back, apply 90-10 or set the v2
# weight to 0.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: backend-v1
          port: 80
          weight: 50
        - name: backend-v2
          port: 80
          weight: 50
