# SHADOW: users get answers from v1.0.0; Envoy sends a copy of every
# request to v2.0.0 and drops its response. v2 runs on real traffic
# without any effect on users: its requests are visible in its logs and
# in http_requests_total{version="v2.0.0"}.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: backend-v1   # answers the user
          port: 80
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: backend-v2   # gets a copy, the response is discarded
              port: 80
