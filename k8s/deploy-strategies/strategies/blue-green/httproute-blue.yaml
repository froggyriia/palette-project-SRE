# BLUE/GREEN: switch all traffic to blue = v2.0.0 with one apply.
# v1.0.0 keeps running without traffic, ready for an instant rollback
# (kubectl apply -f httproute-green.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: backend-v2
          port: 80
