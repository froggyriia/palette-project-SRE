# BLUE/GREEN: green = v1.0.0 receives 100% of the traffic.
# v2.0.0 (blue) is already running and Ready, but gets no traffic.
# Applying this file after httproute-blue.yaml is the instant rollback.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: backend-v1
          port: 80
