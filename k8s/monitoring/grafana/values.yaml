# Helm values for grafana-community/grafana.
#   helm repo add grafana-community https://grafana-community.github.io/helm-charts
#   helm install grafana grafana-community/grafana -n monitoring -f k8s/monitoring/grafana/values.yaml
#
# The VictoriaMetrics data source is provisioned from this file. The app
# dashboard is loaded by the dashboards sidecar from a ConfigMap labelled
# grafana_dashboard=1 (k8s/monitoring/grafana/kustomization.yaml).

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # VictoriaMetrics is compatible with the Prometheus query API, so it is
      # added as a Prometheus data source. A fixed uid lets the dashboard JSON
      # reference it.
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://vmsingle-victoria-metrics-single-server.monitoring.svc:8428
        isDefault: true
        jsonData:
          timeInterval: 15s

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: monitoring

# Grafana 13 needs more than 256 MiB at startup (it was OOMKilled with that limit).
resources:
  requests: {cpu: 50m, memory: 256Mi}
  limits: {memory: 768Mi}
