# Alertmanager config template. <TELEGRAM_CHAT_ID> is substituted when the
# Secret is created; the bot token is read from a separate Secret file.
route:
  receiver: telegram
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram/bot_token
        chat_id: <TELEGRAM_CHAT_ID>
        send_resolved: true
        parse_mode: HTML
        message: |-
          {{ if eq .Status "firing" }}<b>[FIRING]</b>{{ else }}<b>[RESOLVED]</b>{{ end }} {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
