# Alertmanager config template. <TELEGRAM_CHAT_ID> is substituted when the
# Secret is created; the bot token is read from a separate Secret file.
route:
  receiver: telegram
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram/bot_token
        chat_id: <TELEGRAM_CHAT_ID>
        send_resolved: true
        parse_mode: HTML
        # Firing: what happened and when it started.
        # Resolved: what recovered, how long the incident lasted, and the last
        # value seen during the incident (vmalert sends the annotations as they
        # were at the last evaluation before recovery, so it is labelled as such).
        message: |-
          {{ range .Alerts }}{{ if eq .Status "firing" }}<b>[FIRING]</b> {{ .Labels.alertname }} ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          Начало: {{ .StartsAt.UTC.Format "02.01 15:04:05" }} UTC
          {{ else }}<b>[RESOLVED]</b> {{ .Labels.alertname }} ({{ .Labels.severity }})
          {{ with .Annotations.resolved }}{{ . }}{{ else }}Проблема устранена.{{ end }}
          Длительность сбоя: {{ (.EndsAt.Sub .StartsAt).Round 1000000000 }} ({{ .StartsAt.UTC.Format "15:04:05" }} – {{ .EndsAt.UTC.Format "15:04:05" }} UTC)
          Во время сбоя: {{ .Annotations.summary }}. {{ .Annotations.description }}
          {{ end }}
          {{ end }}
