# Extra permission for VictoriaMetrics: read kubelet and cAdvisor metrics
# through the API server proxy (jobs kubernetes-nodes and
# kubernetes-nodes-cadvisor). The chart's own ClusterRole does not grant
# nodes/proxy, so these jobs returned 403.
#   kubectl apply -f k8s/monitoring/rbac-nodes-proxy.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmsingle-nodes-proxy
rules:
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmsingle-nodes-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmsingle-nodes-proxy
subjects:
  - kind: ServiceAccount
    name: vmsingle-victoria-metrics-single-server
    namespace: monitoring
