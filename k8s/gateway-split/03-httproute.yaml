# Traffic split 90/10: every request is sent to backend-v1 with weight 90 and
# to backend-v2 with weight 10, i.e. ~90% and ~10% of the requests.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: palette-split
  namespace: gateway-split
spec:
  parentRefs:
    - name: palette-gateway
  rules:
    - backendRefs:
        - name: backend-v1
          port: 80
          weight: 90
        - name: backend-v2
          port: 80
          weight: 10
