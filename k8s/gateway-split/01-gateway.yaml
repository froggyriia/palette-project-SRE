# Entry point of the traffic: Gateway with an HTTP listener on port 80.
# GatewayClass eg is served by Envoy Gateway (installed by
# k8s/deploy-strategies/setup.sh); for this Gateway the controller starts a
# separate Envoy proxy in the namespace envoy-gateway-system.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: palette-gateway
  namespace: gateway-split
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
